name: Documentation
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: docs
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
        with:
          # Full history, for each page's "Last updated" date.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          # CVE-2026-111497 fixed in 26.12.1 (Brotli decoder).
          node-version: '26.12.1'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --prefix docs
      - run: npm test --prefix docs
      # Fails on dead links and broken anchors.
      - run: npm run build --prefix docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist
      - uses: actions/deploy-pages@v5
        id: deployment
