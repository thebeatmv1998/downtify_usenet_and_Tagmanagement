services:
  downtify:
    container_name: downtify
    image: 'downtify:${TAG-latest}'
    restart: unless-stopped
    build: .
    ports:
      - '8000:8000'
    volumes:
      - ./docker/downloads:/downloads
      - ./docker/data:/data
      # Existing music folders (container path goes in Settings):
      # - ./mp3:/music/collection
      # slskd's download folder, when using the slskd audio source:
      # - ./docker/slskd:/slskd
      # SABnzbd's "Completed Downloads" folder, when using the usenet audio
      # source (mount with the same path SABnzbd reports, or set
      # complete_dir=/usenet in Settings → Usenet):
      # - ./docker/usenet:/usenet
      # - ./docker/cookies.txt:/cookies.txt
    environment:
      # Automatic PO Token generation via a bgutil-ytdlp-pot-provider
      # sidecar container (the reliable fix for YouTube's bot check):
      # - DOWNTIFY_YT_POT_PROVIDER=http://bgutil-pot:4416
      - DOWNTIFY_PORT=30321
      # https://downtify.henriquesebastiao.com/getting-started/environment-variables/#getting-a-cookiestxt
      # - DOWNTIFY_COOKIES_FILE=/cookies.txt
      # Automatic PO Token generation via a bgutil-ytdlp-pot-provider
      # sidecar container (the reliable fix for YouTube's bot check):
      # - DOWNTIFY_YT_POT_PROVIDER=http://bgutil-pot:4416
      # - TZ=America/Sao_Paulo
      # - DOWNTIFY_MONITOR_SYNC_TIME=03:00
    dns:
      - 1.1.1.1
      - 1.0.0.1
